name: Browser-based Windows VPS via noVNC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Install Tools & VNC Server
        run: |
          # Chocolatey se TightVNC server aur git/python install karo
          choco install tightvnc python git -y
          refreshenv

      - name: Configure and Start TightVNC Server
        run: |
          # VNC Registry mein password set karne ke liye (Password: password123)
          New-Item -Path "HKCU:\Software\TightVNC\Server" -Force
          Set-ItemProperty -Path "HKCU:\Software\TightVNC\Server" -Name "Password" -Value ([byte[]](0x01,0x02,0x03,0x04,0x05,0x06,0x07,0x08))
          
          # TightVNC background mein start karo
          Start-Process "C:\Program Files\TightVNC\tvnserver.exe" -ArgumentList "-controlservice"
          Start-Process "C:\Program Files\TightVNC\tvnserver.exe" -ArgumentList "-run"

      - name: Setup noVNC (Web Browser Client)
        run: |
          # noVNC repo clone karo taaki browser UI mil sake
          git clone https://github.com/novnc/noVNC.git C:\noVNC
          
          # Websockify install karo jo VNC stream ko WebSocket mein convert karega
          pip install numpy websockify

      - name: Start noVNC Web Server & Websockify
        run: |
          # Background mein websockify run karo (Port 6080 -> VNC Port 5900)
          Start-Job -ScriptBlock {
              python C:\noVNC\utils\launch.py --vnc localhost:5900 --listen 6080
          }

      - name: Install Bore CLI & Expose Browser Link
        run: |
          # Bore download karo taaki public URL mil sake
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.4.1/bore-v0.4.1-x86_64-pc-windows-msvc.zip" -OutFile "bore.zip"
          Expand-Archive -Path "bore.zip" -DestinationPath "C:\tools"
          
          Start-Sleep -Seconds 5
          Write-Host "=== STARTING BORE TUNNEL ==="
          C:\tools\bore.exe local 6080 --to bore.pub

      - name: Keep Alive (6 Hours Max)
        run: Start-Sleep -Seconds 21600
